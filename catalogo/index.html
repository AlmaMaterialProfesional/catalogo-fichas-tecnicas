<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo 2027 · ALMA Material Profesional</title>
<meta name="description" content="Consulta online el catálogo 2027 de ALMA Material Profesional.">
<meta property="og:title" content="Catálogo 2027 · ALMA Material Profesional">
<meta property="og:description" content="Consulta online nuestro catálogo de productos.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#111111">
<style>
  :root{--naranja:#C85A00;--barra:#111;--fondo:#3a3a3a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--fondo);font-family:Arial,Helvetica,sans-serif}
  header{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--barra);color:#fff;
    padding:env(safe-area-inset-top,0) 12px 0;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top,0px))}
  header .titulo{font-weight:bold;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  header .titulo span{color:var(--naranja)}
  .ctrl{display:flex;align-items:center;gap:6px}
  button{background:#2a2a2a;color:#fff;border:0;border-radius:6px;min-width:36px;height:34px;font-size:18px;cursor:pointer}
  button:hover{background:var(--naranja)}
  #pag{font-size:14px;white-space:nowrap}
  #pag input{width:44px;height:30px;border:0;border-radius:5px;text-align:center;font-size:14px}
  main{padding:calc(64px + env(safe-area-inset-top,0px)) 8px calc(16px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;align-items:center;gap:10px}
  .page{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);position:relative;max-width:100%}
  .page canvas{display:block;width:100%;height:100%}
  #cargando{color:#ddd;margin-top:30vh;text-align:center;font-size:15px}
  #barra{width:200px;height:4px;background:#555;margin:12px auto;border-radius:2px;overflow:hidden}
  #barra div{height:100%;width:35%;background:var(--naranja);animation:mov 1.1s ease-in-out infinite alternate}
  @keyframes mov{from{margin-left:0}to{margin-left:65%}}
  @media (max-width:520px){.zoom{display:none} header .titulo{font-size:13px}}
</style>
</head>
<body oncontextmenu="return false">
<header>
  <div class="titulo">ALMA <span>Material Profesional</span> · Catálogo 2027</div>
  <div class="ctrl zoom"><button id="menos" title="Alejar">−</button><button id="mas" title="Acercar">+</button></div>
  <div class="ctrl" id="pag"><input id="num" type="number" min="1" value="1" inputmode="numeric"> / <span id="total">–</span></div>
</header>
<main id="visor"><div id="cargando">Cargando catálogo…<div id="barra"><div></div></div></div></main>
<script type="module">
import * as pdfjsLib from "./pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "./pdf.worker.min.mjs";

const visor = document.getElementById("visor");
const numIn = document.getElementById("num");
let pdf, escala = 1, paginas = [], ancho0 = 0, alto0 = 0;

function anchoBase(){ return Math.min(window.innerWidth - 16, 1000); }

const URL_PDF = "./catalogo.pdf";
const TROZO = 131072;
async function rango(a, b){
  const r = await fetch(URL_PDF, { headers: { Range: `bytes=${a}-${b-1}` } });
  if (r.status !== 206) throw new Error("sin-rangos");
  return { r, d: new Uint8Array(await r.arrayBuffer()) };
}
try {
  // Carga por trozos: solo se descarga lo necesario para las páginas visibles
  const ini = await rango(0, TROZO);
  const total = +ini.r.headers.get("content-range").split("/")[1];
  const tr = new pdfjsLib.PDFDataRangeTransport(total, ini.d);
  tr.requestDataRange = (a, b) => {
    const intento = n => rango(a, b).then(x => tr.onDataRange(a, x.d)).catch(e => { if (n > 0) setTimeout(() => intento(n-1), 800); });
    intento(3);
  };
  pdf = await pdfjsLib.getDocument({ range: tr, rangeChunkSize: TROZO, disableAutoFetch: false, disableStream: true }).promise;
} catch (e) {
  // Alternativa: descarga completa si el servidor no admite rangos
  pdf = await pdfjsLib.getDocument({ url: URL_PDF }).promise;
}
document.getElementById("total").textContent = pdf.numPages;
numIn.max = pdf.numPages;
const p1 = await pdf.getPage(1);
const vp = p1.getViewport({ scale: 1 }); ancho0 = vp.width; alto0 = vp.height;
visor.innerHTML = "";

for (let i = 1; i <= pdf.numPages; i++) {
  const d = document.createElement("div");
  d.className = "page"; d.dataset.n = i;
  visor.appendChild(d); paginas.push(d);
}
function dimensionar(){
  const w = anchoBase() * escala;
  paginas.forEach(d => { d.style.width = w+"px"; d.style.height = (w*alto0/ancho0)+"px"; d.style.maxWidth = escala>1 ? "none" : "100%"; });
  paginas.forEach(d => { if (d.dataset.r) { d.dataset.r = ""; d.innerHTML = ""; } });
  observar();
}
async function pintar(d){
  if (d.dataset.r) return; d.dataset.r = "1";
  const page = await pdf.getPage(+d.dataset.n);
  const w = d.clientWidth, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const v = page.getViewport({ scale: (w/ancho0) * dpr });
  const c = document.createElement("canvas"); c.width = v.width; c.height = v.height;
  await page.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
  d.innerHTML = ""; d.appendChild(c);
}
function liberar(d){ if (d.dataset.r) { d.dataset.r = ""; d.innerHTML = ""; } }
let obs, obsPag;
function observar(){
  obs?.disconnect(); obsPag?.disconnect();
  obs = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? pintar(e.target) : liberar(e.target)), { rootMargin: "150% 0px" });
  obsPag = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && document.activeElement !== numIn) numIn.value = e.target.dataset.n; }), { threshold: 0.5 });
  paginas.forEach(d => { obs.observe(d); obsPag.observe(d); });
}
function ir(n){ n = Math.max(1, Math.min(pdf.numPages, n|0)); paginas[n-1].scrollIntoView({ block: "start" }); window.scrollBy(0, -60); numIn.value = n; }
numIn.addEventListener("change", () => ir(numIn.value));
numIn.addEventListener("keydown", e => { if (e.key === "Enter") { ir(numIn.value); numIn.blur(); } });
function zoom(f){ const n = +numIn.value; escala = Math.max(0.5, Math.min(3, escala*f)); dimensionar(); ir(n); }
document.getElementById("mas").onclick = () => zoom(1.25);
document.getElementById("menos").onclick = () => zoom(0.8);
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { const n=+numIn.value; dimensionar(); ir(n); }, 250); });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey||e.metaKey) && ["s","p"].includes(e.key.toLowerCase())) e.preventDefault();
});
dimensionar();
const h = location.hash.match(/p(?:age|agina)?=(\d+)/i); if (h) ir(+h[1]);
</script>
</body>
</html>
