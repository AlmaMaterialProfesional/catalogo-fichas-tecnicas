<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichas técnicas · ALMA Material Profesional</title>
<meta name="description" content="Consulta las fichas técnicas de los productos ALMA Material Profesional.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecera">
  <img src="assets/logo.png" alt="ALMA Material Profesional" class="logo">
  <h1>Fichas técnicas</h1>
  <p class="intro">Selecciona una sección y pulsa sobre un producto para ver su ficha técnica.</p>
</header>

<main id="secciones" class="secciones">
  <p class="aviso">Cargando fichas técnicas…</p>
</main>

<footer class="pie">
  <p>ALMA Material Profesional · Catálogo general 2027</p>
</footer>

<script src="app.js"></script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", (user) => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
</html>
