<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha técnica · ALMA Material Profesional</title>
<meta name="theme-color" content="#111111">
<link rel="icon" href="../assets/logo.png">
<style>
  :root{--naranja:#C85A00;--barra:#111;--fondo:#3a3a3a}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--fondo);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
  header{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--barra);color:#fff;
    padding:env(safe-area-inset-top,0) 10px 0;display:flex;align-items:center;gap:8px;height:calc(56px + env(safe-area-inset-top,0px))}
  .volver{display:flex;align-items:center;gap:4px;color:#fff;text-decoration:none;font-size:14px;padding:8px 10px 8px 4px;border-radius:6px;white-space:nowrap}
  .volver::before{content:"";width:9px;height:9px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);margin:0 4px 0 6px}
  .volver:hover{background:#2a2a2a}
  .titulo{flex:1;min-width:0;font-weight:bold;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrl{display:flex;align-items:center;gap:6px}
  button{background:#2a2a2a;color:#fff;border:0;border-radius:6px;min-width:36px;height:34px;font-size:18px;cursor:pointer}
  button:hover{background:var(--naranja)}
  .descargar{background:var(--naranja);color:#fff;text-decoration:none;font-size:13px;font-weight:bold;padding:9px 12px;border-radius:6px;white-space:nowrap}
  .descargar:hover{background:#a34900}
  main{padding:calc(68px + env(safe-area-inset-top,0px)) 8px calc(16px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;align-items:center;gap:10px}
  .page{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);position:relative;max-width:100%}
  .page canvas{display:block;width:100%;height:100%}
  .estado{color:#ddd;margin-top:30vh;text-align:center;font-size:15px;line-height:1.6;padding:0 16px}
  .estado a{color:#fff}
  #barra{width:200px;height:4px;background:#555;margin:12px auto;border-radius:2px;overflow:hidden}
  #barra div{height:100%;width:35%;background:var(--naranja);animation:mov 1.1s ease-in-out infinite alternate}
  @keyframes mov{from{margin-left:0}to{margin-left:65%}}
  @media (max-width:560px){.zoom{display:none} .titulo{font-size:14px}}
</style>
</head>
<body>
<header>
  <a class="volver" href="../" id="volver">Volver</a>
  <div class="titulo" id="titulo">Ficha técnica</div>
  <div class="ctrl zoom"><button id="menos" title="Alejar">−</button><button id="mas" title="Acercar">+</button></div>
  <a class="descargar" id="descargar" href="#" download>Descargar</a>
</header>
<main id="visor"><div class="estado">Cargando ficha técnica…<div id="barra"><div></div></div></div></main>
<script type="module">
import * as pdfjsLib from "../catalogo/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "../catalogo/pdf.worker.min.mjs";

const visor = document.getElementById("visor");
const params = new URLSearchParams(location.search);
const archivo = params.get("f") || "";
const nombre = params.get("t") || "Ficha técnica";

// Volver a la sección de la que venimos, conservando el desplegable abierto
if (document.referrer && new URL(document.referrer).origin === location.origin) {
  document.getElementById("volver").addEventListener("click", (e) => { e.preventDefault(); history.back(); });
}

function error(msg) {
  visor.innerHTML = "";
  const d = document.createElement("div");
  d.className = "estado";
  d.textContent = msg;
  if (/^\/uploads\/[^/]+\.pdf$/i.test(archivo)) {
    d.appendChild(document.createElement("br"));
    const a = document.createElement("a");
    a.href = archivo; a.textContent = "Abrir el PDF directamente";
    d.appendChild(a);
  }
  visor.appendChild(d);
}

if (!/^\/uploads\/[^/]+\.pdf$/i.test(archivo)) {
  document.getElementById("descargar").style.display = "none";
  error("No se ha encontrado la ficha técnica.");
  throw new Error("ficha-no-valida");
}

document.title = nombre + " · Ficha técnica ALMA";
document.getElementById("titulo").textContent = nombre;
const descargar = document.getElementById("descargar");
descargar.href = archivo;
descargar.setAttribute("download", archivo.split("/").pop());

let pdf, escala = 1, paginas = [], ancho0 = 0, alto0 = 0;
function anchoBase(){ return Math.min(window.innerWidth - 16, 1000); }

const TROZO = 131072;
async function rango(a, b){
  const r = await fetch(archivo, { headers: { Range: `bytes=${a}-${b-1}` } });
  if (r.status !== 206) throw new Error("sin-rangos");
  return { r, d: new Uint8Array(await r.arrayBuffer()) };
}
try {
  try {
    // Carga por trozos: solo se descarga lo necesario para las páginas visibles
    const ini = await rango(0, TROZO);
    const total = +ini.r.headers.get("content-range").split("/")[1];
    const tr = new pdfjsLib.PDFDataRangeTransport(total, ini.d);
    tr.requestDataRange = (a, b) => {
      const intento = n => rango(a, b).then(x => tr.onDataRange(a, x.d)).catch(() => { if (n > 0) setTimeout(() => intento(n-1), 800); });
      intento(3);
    };
    pdf = await pdfjsLib.getDocument({ range: tr, rangeChunkSize: TROZO, disableAutoFetch: false, disableStream: true }).promise;
  } catch (e) {
    // Alternativa: descarga completa si el servidor no admite rangos
    pdf = await pdfjsLib.getDocument({ url: archivo }).promise;
  }
} catch (e) {
  error("No se ha podido mostrar la ficha técnica.");
  throw e;
}

const p1 = await pdf.getPage(1);
const vp = p1.getViewport({ scale: 1 }); ancho0 = vp.width; alto0 = vp.height;
visor.innerHTML = "";

for (let i = 1; i <= pdf.numPages; i++) {
  const d = document.createElement("div");
  d.className = "page"; d.dataset.n = i;
  visor.appendChild(d); paginas.push(d);
}
function dimensionar(){
  const w = anchoBase() * escala;
  paginas.forEach(d => { d.style.width = w+"px"; d.style.height = (w*alto0/ancho0)+"px"; d.style.maxWidth = escala>1 ? "none" : "100%"; });
  paginas.forEach(d => { if (d.dataset.r) { d.dataset.r = ""; d.innerHTML = ""; } });
  observar();
}
async function pintar(d){
  if (d.dataset.r) return; d.dataset.r = "1";
  const page = await pdf.getPage(+d.dataset.n);
  const w = d.clientWidth, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const v = page.getViewport({ scale: (w/ancho0) * dpr });
  const c = document.createElement("canvas"); c.width = v.width; c.height = v.height;
  await page.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
  d.innerHTML = ""; d.appendChild(c);
}
function liberar(d){ if (d.dataset.r) { d.dataset.r = ""; d.innerHTML = ""; } }
let obs;
function observar(){
  obs?.disconnect();
  obs = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? pintar(e.target) : liberar(e.target)), { rootMargin: "150% 0px" });
  paginas.forEach(d => obs.observe(d));
}
function zoom(f){ escala = Math.max(0.5, Math.min(3, escala*f)); dimensionar(); }
document.getElementById("mas").onclick = () => zoom(1.25);
document.getElementById("menos").onclick = () => zoom(0.8);
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(dimensionar, 250); });
dimensionar();
</script>
</body>
</html>
